<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<title>RetaTracker</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peptide Guru">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app, glowing "Peptide Guru" dark brand, summary tiles before detail */
:root{
  --bg:#04070d; --surface:#0b1220; --surface2:#0f1a2e; --ink:#eef4ff; --muted:#8fa0bd; --line:#1a2842;
  --accent:#2f8cff; --accent2:#5fd4ff; --accent-soft:#0f2547; --good:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --chip:#111d33; --glow:0 0 0 1px rgba(47,140,255,.35), 0 8px 30px -8px rgba(47,140,255,.45);
  --hero:linear-gradient(135deg,#1f7bff 0%,#0b47c9 55%,#081f66 100%);
  --font-display:"Saira Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef3fb; --surface:#ffffff; --surface2:#f5f8fd; --ink:#0b1424; --muted:#56637a; --line:#d8e1ef;
  --accent:#1667f2; --accent2:#0aa5e8; --accent-soft:#e2ecff; --good:#0f8a5f; --warn:#b45309; --bad:#c2263a;
  --chip:#e9eff9; --glow:0 0 0 1px rgba(22,103,242,.18), 0 8px 24px -10px rgba(22,103,242,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 50% -120px, rgba(47,140,255,.28), transparent 70%), radial-gradient(600px 300px at 110% 30%, rgba(95,212,255,.08), transparent 70%), var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(47,140,255,.6);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 16px rgba(47,140,255,.45)}50%{box-shadow:0 0 0 2px var(--accent2),0 0 30px rgba(95,212,255,.7)}}
h1{font:800 30px/1 var(--font-display);margin:0;letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(180deg,#fff 0%,#c9d6ea 60%,#8ea3c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] h1{background:linear-gradient(180deg,#0b1424,#2a3b5a);-webkit-background-clip:text;background-clip:text}
h2{font:700 21px/1.15 var(--font-display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font:800 30px/1.05 var(--font-display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--muted)}
.hero{background:var(--hero);color:#fff;border:0;box-shadow:0 14px 40px -12px rgba(31,123,255,.65), 0 0 0 1px rgba(255,255,255,.08) inset;position:relative;overflow:hidden}
.hero .v{font-size:28px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 40px rgba(95,212,255,.35)}
.hero > *{position:relative;z-index:1}
.hero .k,.hero .d{color:rgba(255,255,255,.82)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--chip);border:1px solid var(--line)}
.banner.warn{border-left:4px solid var(--warn)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:linear-gradient(135deg,#2f8cff,#1456d6);border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px rgba(47,140,255,.7)}
.btn{transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible,nav.tabs a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1 1 140px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.scale input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sites button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:13px;cursor:pointer;min-height:52px;line-height:1.2}
.sites button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.sites button .t{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.sites button[aria-pressed="true"] .t{color:rgba(255,255,255,.85)}
.sites button.suggest{border:2px dashed var(--accent)}
.entry{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .day{text-align:center;border-radius:10px;background:var(--chip);padding:5px 0}
.entry .day b{display:block;font:700 18px/1 var(--font-display)}
.entry .day span{font-size:11px;color:var(--muted);text-transform:uppercase}
.entry .meta{font-size:13px;color:var(--muted)}
.entry .title{font-weight:600}
.entry .notes{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.stripe{width:4px;border-radius:4px;align-self:stretch}
.month{font:600 13px/1 var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--surface) 82%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs a{flex:1;min-width:0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--accent2);text-shadow:0 0 12px rgba(95,212,255,.55)}
nav.tabs a[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(95,212,255,.7))}
nav.tabs a.add svg{color:#fff;background:linear-gradient(135deg,#2f8cff,#1456d6);border-radius:50%;padding:3px;box-shadow:0 6px 18px -4px rgba(47,140,255,.8);margin-top:-14px;width:42px !important;height:42px !important}
nav.tabs a.add svg circle{stroke:transparent}
nav.tabs svg{width:24px;height:24px}
nav.tabs a.add svg{width:30px;height:30px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-body);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.dialog{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.dialog.open{display:flex}
.dialog .sheet{background:var(--surface);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:85%;overflow:auto;margin-bottom:env(safe-area-inset-bottom)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.bmiscale{position:relative;height:14px;border-radius:7px;display:flex;overflow:hidden}
.bmiscale i{display:block;height:100%}
.bmimark{position:absolute;top:-5px;width:4px;height:24px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface);transform:translateX(-2px)}
.bmimark.start{background:var(--muted);height:18px;top:-2px;opacity:.8}
.bmilabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin-bottom:0}
.msg.a ul{margin:0 0 8px;padding-left:20px}.msg.a li{margin:2px 0}
.msg.a h4{font:600 15px/1.3 var(--font-display);margin:10px 0 4px}
.msg.a a{color:var(--accent);text-decoration:underline;overflow-wrap:anywhere}
.msg.a.thinking{color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 72px);background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:48px;max-height:140px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
#view > *{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font:800 30px/1 var(--font-display)}
.ring .c span{font-size:10px;line-height:1.2;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent2);border:1px solid rgba(95,212,255,.25)}
.badge.off{background:transparent;color:var(--muted);border-color:var(--line);opacity:.7}
.bigdelta{font:800 54px/0.95 var(--font-display);letter-spacing:.01em;background:linear-gradient(180deg,#fff,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .bigdelta{background:linear-gradient(180deg,#0b47c9,#1f7bff);-webkit-background-clip:text;background-clip:text}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="Peptide Guru Logo" width="52" height="52">
      <div>
        <h1>Peptide Guru</h1>
        <div class="sub" id="syncState">Verbinde …</div>
      </div>
    </div>
    <button class="btn ghost" id="themeBtn" aria-label="Hell/Dunkel umschalten" style="width:44px;padding:0;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <div class="in">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Übersicht</a>
    <a href="#charts" data-tab="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Verlauf</a>
    <a href="#log" data-tab="log" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>Eintrag</a>
    <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Tagebuch</a>
    <a href="#ai" data-tab="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>Studien</a>
    <a href="#tools" data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Tools</a>
  </div>
</nav>

<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="sheet stack">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="row" id="dlgBtns"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const SITES = [
  {id:"bauch-l", label:"Bauch links"},
  {id:"bauch-r", label:"Bauch rechts"},
  {id:"bein-l", label:"Oberschenkel links"},
  {id:"bein-r", label:"Oberschenkel rechts"},
  {id:"arm-l", label:"Oberarm links"},
  {id:"arm-r", label:"Oberarm rechts"}
];
const EFFECTS = ["Übelkeit","Sodbrennen","Verstopfung","Durchfall","Müdigkeit","Kopfschmerzen","Herzrasen","Schlafprobleme","Reizung Einstichstelle","Kribbeln Haut"];
const DEFAULT_SETTINGS = {intervalDays:7, goalWeight:null, heightCm:null, vials:[], age:null, sex:"m", steps:null, intake:null, deficit:500, calcWeight:null};

/* ---------- state ---------- */
let entries = [];          // normalized entries
let settings = Object.assign({}, DEFAULT_SETTINGS);
let mode = "connecting";   // "db" | "local" | "connecting"
let db = null, entriesCol = null, settingsDoc = null;
let downloads = null;
let editing = null;        // entry being edited in the form
let histFilter = "all";
let isOwner = false, mcp = null, sample = null, chatDoc = null, chat = [], chatBusy = false, chatCtl = null, chatLoaded = false;
let withData = true;
let aiMode = "search", sparmodus = true;
let pmState = {q:"", results:[], total:0, busy:false, err:"", sort:"relevance", filter:"all"};
let autoTr = true;
try { const at = localStorage.getItem("retatracker.autotr"); if (at) autoTr = at==="1"; } catch(_){}
try { const m = localStorage.getItem("retatracker.aimode"); if (m) aiMode = m; const sp = localStorage.getItem("retatracker.spar"); if (sp) sparmodus = sp==="1"; } catch(_){}

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=1) => (n==null || isNaN(n)) ? "–" : Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const sign = (n, d=1) => (n==null||isNaN(n)) ? "–" : (n>0?"+":n<0?"−":"±") + fmt(Math.abs(n), d);
const DAY = 86400000;
const fmtDate = d => new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDateShort = d => new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const fmtTime = d => new Date(d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
function toLocalInput(d){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); }
function safeId(s){ return String(s||"").replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").replace(/^\.+$/,"x").slice(0,120) || newId(); }
function newId(){ return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9); }
function num(v){
  if(v==null) return null;
  if(typeof v==="number") return isFinite(v)?v:null;
  const t=String(v).replace(/[\s\u00a0\u202f']/g,"").replace(/[٫،,]/g,".").replace(/[^0-9.\-]/g,"");
  if(!t) return null;
  const parts=t.split("."); const clean = parts.length>2 ? parts.slice(0,-1).join("")+"."+parts[parts.length-1] : t;
  const n=parseFloat(clean); return isFinite(n)?n:null;
}
function parseDose(s){ if(s==null) return null; if(typeof s==="number") return s; const m=String(s).replace(",",".").match(/([\d.]+)\s*(mg|mcg|µg)?/i); if(!m) return null; let n=parseFloat(m[1]); if(isNaN(n)) return null; if(m[2] && /mcg|µg/i.test(m[2])) n=n/1000; return n; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* Normalize an entry from the original RetaTracker export or from this app */
function normalize(raw){
  const e = {};
  e.id = safeId(raw.id || newId());
  e.peptide = String(raw.peptide||"").trim().replace(/\s+/g," ");
  e.dosage = String(raw.dosage||"").trim();
  e.doseMg = raw.doseMg!=null ? num(raw.doseMg) : parseDose(e.dosage);
  const d = new Date(raw.date || Date.now());
  e.date = isNaN(d) ? new Date().toISOString() : d.toISOString();
  e.manufacturer = String(raw.manufacturer||"").trim();
  e.vial = raw.vial!=null ? String(raw.vial).trim() : "";
  e.site = raw.site || "";
  for (const k of ["nausea","hunger","satiety","energyLevel","weight","waistCircumference"]) e[k] = num(raw[k]);
  e.doseChange = raw.doseChange || "";
  e.notes = String(raw.notes||"").trim();
  e.sideEffects = Array.isArray(raw.sideEffects) ? raw.sideEffects.filter(x=>typeof x==="string").slice(0,20) : [];
  e.auto = !!raw.auto || /Automatisch vom Injektionskalender/i.test(e.notes);
  e.type = raw.type || (e.doseMg!=null ? "injection" : "measure");
  return e;
}
function toExport(e){
  const o = {peptide:e.peptide, dosage:e.dosage, date:e.date};
  if(e.manufacturer) o.manufacturer=e.manufacturer;
  if(e.vial) o.vial=e.vial;
  for (const k of ["nausea","hunger","satiety","energyLevel","weight","waistCircumference"]) if(e[k]!=null) o[k]=e[k];
  if(e.doseChange) o.doseChange=e.doseChange;
  if(e.notes) o.notes=e.notes;
  if(e.site) o.site=e.site;
  if(e.sideEffects && e.sideEffects.length) o.sideEffects=e.sideEffects;
  o.id=e.id;
  return o;
}

const sorted = () => entries.slice().sort((a,b)=>a.date<b.date?-1:1);
const injections = () => sorted().filter(e=>e.type==="injection" && e.doseMg!=null);
const weights = () => sorted().filter(e=>e.weight!=null);
const waists = () => sorted().filter(e=>e.waistCircumference!=null);

function stats(){
  const w = weights(), inj = injections();
  const s = {};
  s.first = w[0]||null; s.last = w[w.length-1]||null;
  s.change = (s.first && s.last) ? s.last.weight - s.first.weight : null;
  s.changePct = (s.first && s.last) ? s.change / s.first.weight * 100 : null;
  if (s.first && s.last){
    const weeks = (new Date(s.last.date)-new Date(s.first.date))/DAY/7;
    s.perWeek = weeks >= 0.5 ? s.change/weeks : null;
  }
  const wa = waists();
  s.waistChange = wa.length>1 ? wa[wa.length-1].waistCircumference - wa[0].waistCircumference : null;
  s.waistLast = wa.length ? wa[wa.length-1].waistCircumference : null;
  s.lastInj = inj[inj.length-1] || null;
  s.injCount = inj.length;
  s.totalMg = inj.reduce((a,e)=>a+(e.doseMg||0),0);
  if (s.lastInj){
    const next = new Date(new Date(s.lastInj.date).getTime() + (settings.intervalDays||7)*DAY);
    s.next = next;
    const today = new Date(); today.setHours(0,0,0,0);
    const nd = new Date(next); nd.setHours(0,0,0,0);
    s.daysToNext = Math.round((nd - today)/DAY);
  }
  if (settings.heightCm && s.last){ const h=settings.heightCm/100; s.bmi = s.last.weight/(h*h); }
  if (settings.goalWeight && s.first && s.last){
    const total = s.first.weight - settings.goalWeight;
    s.goalPct = total>0 ? Math.max(0,Math.min(100,(s.first.weight - s.last.weight)/total*100)) : null;
    s.toGoal = s.last.weight - settings.goalWeight;
  }
  return s;
}
function siteUsage(){
  const last = {};
  for (const e of injections()) if (e.site) last[e.site] = e.date;
  return last;
}
function suggestedSite(){
  const last = siteUsage();
  let best = SITES[0].id, bestT = Infinity;
  for (const s of SITES){ const t = last[s.id] ? new Date(last[s.id]).getTime() : -1; if (t < bestT){ bestT=t; best=s.id; } }
  return best;
}
function knownPeptides(){ const m=new Map(); for(const e of sorted()) if(e.peptide) m.set(e.peptide.toLowerCase(), e.peptide); return [...m.values()]; }
function vialUsage(label){ return injections().filter(e=>e.vial===label).reduce((a,e)=>a+(e.doseMg||0),0); }

async function saveEntry(e){

/* Body ohne leere Felder schreiben; normalize() füllt sie beim Lesen wieder auf */
function cleanBody(e){
  const o = {};
  for (const [k,v] of Object.entries(e)){
    if (v===null || v===undefined || v==="" || (Array.isArray(v) && !v.length)) continue;
    if (typeof v==="number" && !isFinite(v)) continue;
    o[k]=v;
  }
  return o;
}
async function putRemote(e){
  let lastErr;
  for (let attempt=0; attempt<2; attempt++){
    try { await entriesCol.doc(e.id).set(cleanBody(e)); return; }
    catch(err){ lastErr = err; if (!err || err.code!=="unavailable") break; await new Promise(r=>setTimeout(r, 400+Math.random()*600)); }
  }
  throw lastErr;
}

function handleWriteError(err){
  const c = err && err.code;

/* ---------- Eigenständige Version: kein Claude, keine Cloud ---------- */
const EUTILS = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/";
const pmCache = new Map();
async function eutils(path, params, asText){
  const qs = new URLSearchParams(Object.assign({db:"pubmed", tool:"peptideguru"}, params)).toString();
  const url = EUTILS + path + "?" + qs;
  if (pmCache.has(url)) return pmCache.get(url);
  const r = await fetch(url);
  if (!r.ok) throw {code:"server_unavailable", message:"PubMed antwortet nicht ("+r.status+")"};
  const out = asText ? await r.text() : await r.json();
  pmCache.set(url, out);
  return out;
}
function parsePubmedXml(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const t = (el, sel) => { const x = el.querySelector(sel); return x ? x.textContent.trim() : ""; };
  return [...doc.querySelectorAll("PubmedArticle")].map(a=>{
    const abs = [...a.querySelectorAll("Abstract > AbstractText")].map(x=>{ const l=x.getAttribute("Label"); return (l? l.toUpperCase()+": " : "") + x.textContent.trim(); }).join("\n\n");
    const doiEl = [...a.querySelectorAll("ArticleIdList > ArticleId")].find(x=>x.getAttribute("IdType")==="doi");
    const year = t(a,"Article > Journal > JournalIssue > PubDate > Year") || (t(a,"Article > Journal > JournalIssue > PubDate > MedlineDate").match(/\d{4}/)||[""])[0];
    return {
      identifiers:{pmid:t(a,"MedlineCitation > PMID"), doi: doiEl ? doiEl.textContent.trim() : null},
      title: t(a,"Article > ArticleTitle"), abstract: abs,
      journal:{iso_abbreviation:t(a,"Article > Journal > ISOAbbreviation"), title:t(a,"Article > Journal > Title")},
      authors:[...a.querySelectorAll("AuthorList > Author")].map(x=>({last_name:t(x,"LastName")||t(x,"CollectiveName")})),
      publication_date:{year},
      article_types:[...a.querySelectorAll("PublicationTypeList > PublicationType")].map(x=>x.textContent.trim())
    };
  });
}
const localPubmed = {
  async callTool(server, tool, input){
    if (tool==="search_articles"){
      const p = {term:input.query, retmax:String(input.max_results||10), retmode:"json", sort: input.sort==="pub_date" ? "pub_date" : "relevance"};
      if (input.date_from){ p.mindate=input.date_from; p.maxdate="3000"; p.datetype="pdat"; }
      const j = await eutils("esearch.fcgi", p);
      const r = j.esearchresult || {};
      return {payload:{pmids:r.idlist||[], total_count:+(r.count||0)}};
    }
    if (tool==="get_article_metadata"){
      if (!input.pmids || !input.pmids.length) return {payload:{articles:[]}};
      const xml = await eutils("efetch.fcgi", {id:input.pmids.join(","), retmode:"xml"}, true);
      return {payload:{articles:parsePubmedXml(xml)}};
    }
    throw {code:"bad_request", message:"unbekannt"};
  }
};
const localDownloads = {
  async save({filename, data}){
    const type = filename.endsWith(".csv") ? "text/csv" : "application/json";
    const blob = data instanceof Blob ? data : new Blob([data], {type});
    try {
      const file = new File([blob], filename, {type});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return {status:"saved"}; }
    } catch(e){ if (e && e.name==="AbortError") throw {code:"declined"}; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return {status:"saved"};
  }
};

/* ---------- Dosis im Schnitt (auf 7 Tage umgerechnet) ---------- */
const pepKey = name => (String(name||"?").trim().split(/\s+/)[0] || "?").toLowerCase();
function doseStats(){
  const groups = new Map();
  for (const e of injections()){
    const k = pepKey(e.peptide);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }
  const out = [];
  for (const [k, list] of groups){
    const n = list.length, last = list[n-1];
    const recent = list.slice(-5);                     // letzte bis zu 5 Gaben
    const avgDose = recent.reduce((a,e)=>a+e.doseMg,0)/recent.length;
    const gaps = [];
    for (let i=1;i<recent.length;i++) gaps.push((new Date(recent[i].date)-new Date(recent[i-1].date))/DAY);
    const realGap = gaps.length ? gaps.reduce((a,b)=>a+b,0)/gaps.length : null;
    const gap = realGap && realGap>0.5 ? realGap : (settings.intervalDays||7);
    const week = avgDose/gap*7;
    const lastWeek = last.doseMg/(settings.intervalDays||7)*7;
    const since28 = Date.now()-28*DAY;
    const mg28 = list.filter(e=>new Date(e.date).getTime()>=since28).reduce((a,e)=>a+e.doseMg,0);
    const total = list.reduce((a,e)=>a+e.doseMg,0);
    out.push({name:last.peptide||k, n, used:recent.length, avgDose, realGap, gap, week, last, lastWeek, mg28, total});
  }
  return out.sort((a,b)=>a.last.date<b.last.date?1:-1);
}
function doseCard(){
  const st = doseStats();
  if (!st.length) return "";
  return `<div class="card stack">
    <div class="row" style="justify-content:space-between;align-items:baseline"><h2>Dosis im Schnitt</h2><span class="sub">auf 7 Tage umgerechnet</span></div>

      <div class="row" style="justify-content:space-between"><b>${esc(d.name)}</b><span class="pill">${d.n} Injektion${d.n===1?"":"en"}</span></div>
      <div class="grid2">
        <div class="tile"><span class="k">Ø pro 7 Tage</span><span class="v">${fmt(d.week,2)} mg</span><span class="d">aus den letzten ${d.used} Gaben</span></div>
        <div class="tile"><span class="k">Ø pro Gabe</span><span class="v">${fmt(d.avgDose,2)} mg</span><span class="d">${d.realGap ? `alle ${fmt(d.realGap,1)} Tage` : `Rhythmus ${settings.intervalDays} Tage (Einstellung)`}</span></div>
      </div>
      <div>
        <div class="kv"><span>Aktuell ${fmt(d.last.doseMg,2)} mg alle ${settings.intervalDays} Tage</span><span>${fmt(d.lastWeek,2)} mg / 7 Tage</span></div>

      </div>

    </div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">')}
  </div>`;
}


function progressCard(s){
  if (!s.first || !s.last) return "";
  const lost = s.first.weight - s.last.weight;
  let target = settings.goalWeight || null, tLabel = "Ziel";
  if (!target && settings.heightCm){ target = 24.9*(settings.heightCm/100)**2; tLabel = "Normal-BMI"; }
  const pct = target && s.first.weight>target ? Math.max(0,Math.min(1, lost/(s.first.weight-target))) : null;
  const R=50, C=2*Math.PI*R;
  const ring = pct==null ? "" : `<div class="ring" aria-label="${Math.round(pct*100)} Prozent bis ${tLabel}">
    <svg viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#5fd4ff"/><stop offset="1" stop-color="#2f8cff"/></linearGradient></defs>
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="filter:drop-shadow(0 0 6px rgba(95,212,255,.6))"/></svg>
    <div class="c"><b>${Math.round(pct*100)}%</b><span>bis</span><span>${esc(tLabel)}</span></div></div>`;
  const days = Math.max(1, Math.round((new Date(s.last.date)-new Date(s.first.date))/DAY));
  const steps = [1,2,5,10,15,20,25,30];
  const badges = steps.map(k=>`<span class="badge ${lost>=k?"":"off"}">${lost>=k?"✓":""} −${k} kg</span>`).slice(0, Math.max(4, steps.findIndex(k=>lost<k)+2));
  const bmiNow = settings.heightCm ? s.last.weight/(settings.heightCm/100)**2 : null;
  if (bmiNow!=null) badges.push(`<span class="badge ${bmiNow<30?"":"off"}">${bmiNow<30?"✓ ":""}BMI unter 30</span>`, `<span class="badge ${bmiNow<25?"":"off"}">${bmiNow<25?"✓ ":""}BMI unter 25</span>`);
  return `<div class="card stack" style="gap:12px;box-shadow:var(--glow)">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:14px">
      <div style="min-width:0">
        <div class="sub" style="text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:12px">Seit Start</div>
        <div class="bigdelta num">${lost>=0?"−":"+"}${fmt(Math.abs(lost))}<span style="font-size:26px"> kg</span></div>
        <div class="sub num">${fmt(s.first.weight)} → ${fmt(s.last.weight)} kg in ${days} Tagen${s.changePct!=null?` · ${sign(s.changePct)} %`:""}</div>
      </div>
      ${ring}
    </div>
    <div class="badges">${badges.join("")}</div>
  </div>`;
}

function lineChart(points, opt){
  const W=340, H=opt.h||170, pl=36, pr=10, pt=12, pb=24;
  const ts = points.map(p=>new Date(p.t).getTime());
  const ys = points.map(p=>p.y);
  let t0=Math.min(...ts), t1=Math.max(...ts); if (t1===t0){ t0-=DAY; t1+=DAY; }
  let y0=Math.min(...ys), y1=Math.max(...ys);
  if (opt.goal!=null){ y0=Math.min(y0,opt.goal); y1=Math.max(y1,opt.goal); }
  const pad = Math.max((y1-y0)*0.15, opt.minPad||0.5); y0-=pad; y1+=pad;
  const X = t => pl + (t-t0)/(t1-t0)*(W-pl-pr);
  const Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  const step = opt.step;
  let d="";
  points.forEach((p,i)=>{
    const x=X(ts[i]), y=Y(p.y);
    if (i===0) d+=`M${x},${y}`;
    else if (step) d+=`H${x}V${y}`;
    else d+=`L${x},${y}`;
  });
  if (step) d+=`H${W-pr}`;
  const lastX = step ? W-pr : X(ts[ts.length-1]);
  const area = d + `L${lastX},${H-pb}L${X(ts[0])},${H-pb}Z`;
  const ticks=[]; for(let i=0;i<=3;i++){ const v=y0+(y1-y0)*i/3; ticks.push(v); }
  const grid = ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v, opt.dec??1)}</text>`).join("");
  const xl = `<text x="${pl}" y="${H-6}">${esc(fmtDateShort(t0))}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(fmtDateShort(t1))}</text>`;
  const goal = opt.goal!=null ? `<line x1="${pl}" x2="${W-pr}" y1="${Y(opt.goal)}" y2="${Y(opt.goal)}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Y(opt.goal)-4}" text-anchor="end" style="fill:var(--good)">Ziel</text>` : "";
  const dots = step ? "" : points.map((p,i)=>`<circle cx="${X(ts[i])}" cy="${Y(p.y)}" r="${i===points.length-1?4.5:2.5}" fill="${i===points.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  const last = points[points.length-1];
  const lastLbl = `<text x="${Math.min(X(ts[ts.length-1]), W-pr-4)}" y="${Y(last.y)-9}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmt(last.y, opt.dec??1)} ${esc(opt.unit)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf ${esc(opt.unit)}">
    ${grid}${goal}
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lastLbl}${xl}
  </svg>`;
}

function viewCharts(v){
  const w=weights(), wa=waists(), inj=injections();

  v.innerHTML = `<div class="stack">

    <div class="card stack"><h2>Dosis</h2><div class="chart">${inj.length?lineChart(inj.map(e=>({t:e.date,y:e.doseMg})),{unit:"mg",step:true,dec:2,minPad:0.25}):'<div class="empty">Noch keine Injektion mit Dosis.</div>'}</div></div>

    </div>
    <div class="card"><h2 style="margin-bottom:6px">Gewicht je Dosisstufe</h2>${doseTable()}</div>
  </div>`;
}
function doseTable(){
  const inj=injections(); if(!inj.length) return '<div class="empty">Keine Daten.</div>';
  const w=weights();
  const levels=[]; for(const e of inj){ const l=levels[levels.length-1]; if(!l||l.dose!==e.doseMg) levels.push({dose:e.doseMg,start:e.date,count:1}); else l.count++; }
  levels.forEach((l,i)=>{ l.end = levels[i+1]?levels[i+1].start:null;
    const inR = w.filter(x=>x.date>=l.start && (!l.end||x.date<l.end));
    const before = w.filter(x=>x.date<=l.start).pop() || inR[0];
    const after = inR[inR.length-1];
    l.delta = (before&&after&&before!==after)? after.weight-before.weight : null; });
  return levels.map(l=>`<div class="kv"><span>${fmt(l.dose,2)} mg <span class="sub">ab ${esc(fmtDateShort(l.start))} · ${l.count}×</span></span><span style="color:${l.delta<0?"var(--good)":l.delta>0?"var(--bad)":"inherit"}">${l.delta==null?"–":sign(l.delta)+" kg"}</span></div>`).join("");
}

function entryRow(e){

  if (e.site){ const s=SITES.find(x=>x.id===e.site); if(s) meta.push(s.label); }

}

  const chk = (id, unit, lo, hi) => { const el=$("#"+id), out=$("#"+id+"-chk"); const f=()=>{ const raw=el.value.trim(); if(!raw){ out.textContent=""; return; } const n=num(raw); if(n==null){ out.textContent="Keine gültige Zahl"; out.style.color="var(--bad)"; } else if(n<lo||n>hi){ out.textContent=`${fmt(n)} ${unit}? Bitte prüfen`; out.style.color="var(--warn)"; } else { out.textContent=`✓ ${fmt(n)} ${unit}`; out.style.color="var(--good)"; } }; el.addEventListener("input", f); f(); };
  chk("f-weight","kg",30,300); chk("f-waist","cm",40,200);
  v.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{ r.dataset.set="1"; $("#"+r.id+"-o").textContent=r.value; });
  const ce=$("#cancelEdit"); if(ce) ce.onclick=()=>{ editing=null; v.dataset.view=""; location.hash="#history"; };
  const db_=$("#delBtn"); if(db_) db_.onclick=()=>confirmDlg("Eintrag löschen?","Dieser Eintrag wird dauerhaft entfernt.","Löschen", async ()=>{ const id=editing.id; editing=null; v.dataset.view=""; await deleteEntry(id); location.hash="#history"; toast("Gelöscht"); });

  $("#form").onsubmit = async ev => {
    ev.preventDefault();
    const rv = id => { const r=$("#"+id); return r.dataset.set==="1" ? Number(r.value) : null; };
    for (const [id,l] of [["f-weight","Gewicht"],["f-waist","Taille"],["f-dose","Dosis"]]){ const el=$("#"+id); if(el && el.value.trim() && num(el.value)==null && !(id==="f-dose" && curType!=="injection")){ toast(l+": keine gültige Zahl"); el.focus(); return; } }
    const dateVal = $("#f-date").value;
    const raw = Object.assign({}, isEdit?editing:{}, {
      id: isEdit ? editing.id : newId(),
      type: curType,
      date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
      weight: num($("#f-weight").value),
      waistCircumference: num($("#f-waist").value),
      hunger: rv("f-hunger"), satiety: rv("f-sat"), nausea: rv("f-nau"), energyLevel: rv("f-en"),
      sideEffects: [...v.querySelectorAll('[data-eff][aria-pressed="true"]')].map(b=>b.dataset.eff),
      notes: $("#f-notes").value.trim(),
      auto:false
    });
    if (curType==="injection"){
      const dose = num($("#f-dose").value);
      if (dose==null){ toast("Bitte eine Dosis eintragen oder 'Nur Messung' wählen."); $("#f-dose").focus(); return; }
      raw.peptide=$("#f-pep").value; raw.doseMg=dose; raw.dosage = dose.toFixed(Math.round(dose*100)%10 ? 2 : 1)+" MG";
      raw.manufacturer=$("#f-man").value; raw.vial=$("#f-vial").value; raw.site=curSite;
      const prev = injections().filter(x=>x.id!==raw.id && x.date<raw.date).pop();
      raw.doseChange = !prev ? (raw.doseChange||"") : dose>prev.doseMg ? "increase" : dose<prev.doseMg ? "decrease" : "same";
    } else {
      raw.doseMg=null; raw.dosage=""; raw.site=""; raw.doseChange="";
      if (raw.weight==null && raw.waistCircumference==null && raw.hunger==null && raw.satiety==null && raw.nausea==null && raw.energyLevel==null && !raw.notes && !raw.sideEffects.length){ toast("Bitte mindestens einen Wert eintragen."); return; }
    }
    const ent = normalize(raw); ent.type = curType;
    editing=null; v.dataset.view="";
    location.hash="#home";
    saveEntry(ent);
    toast(isEdit?"Gespeichert":"Eintrag gespeichert");
  };
}


/* ---------- Energiebedarf ---------- */
// Grundumsatz nach Mifflin-St Jeor; Alltag = Grundumsatz x 1,2 (sitzend, ~3000 Schritte);
// jeder Schritt darüber ≈ 0,0005 kcal je kg Körpergewicht (10.000 Schritte bei 90 kg ≈ 450 kcal).
const KCAL_PER_KG = 7700;
function energy(o){
  const {weight, heightCm, age, sex, steps} = o;
  if (!weight || !heightCm || !age) return null;
  const bmr = 10*weight + 6.25*heightCm - 5*age + (sex==="w" ? -161 : 5);
  const base = bmr*1.2;
  const extraSteps = Math.max(0, (steps||0) - 3000);
  const stepKcal = extraSteps * weight * 0.0005;
  return {bmr, base, stepKcal, tdee: base + stepKcal};
}
function energyCard(){
  const w = weights().pop();
  return `<div class="card stack">
    <h2>Kalorien &amp; Defizit</h2>
    <p class="sub" style="margin:0">Grundumsatz, Tagesbedarf mit deinen Schritten und was ein Defizit an Kilos bringen würde. Größe und Zielgewicht kommen aus den Einstellungen oben.</p>
    <div class="row">
      <label class="f grow" for="e-w">Gewicht (kg)<input type="text" inputmode="decimal" step="0.1" id="e-w" value="${(()=>{ const cw = (w && (!settings.calcWeightAt || w.date > settings.calcWeightAt)) ? w.weight : (settings.calcWeight ?? (w?w.weight:null)); return cw!=null?fmt(cw):""; })()}" placeholder="z. B. 90,3"></label>
      <label class="f grow" for="e-age">Alter<input type="number" inputmode="numeric" id="e-age" value="${settings.age??""}"></label>
    </div>
    <div class="seg" role="group" aria-label="Geschlecht">
      <button type="button" data-sex="m" aria-pressed="${settings.sex!=="w"}">Mann</button>
      <button type="button" data-sex="w" aria-pressed="${settings.sex==="w"}">Frau</button>
    </div>
    <div class="row">
      <label class="f grow" for="e-steps">Schritte pro Tag<input type="number" inputmode="numeric" step="500" id="e-steps" value="${settings.steps??""}" placeholder="8000"></label>
      <label class="f grow" for="e-int">Du isst (kcal/Tag, optional)<input type="number" inputmode="numeric" step="50" id="e-int" value="${settings.intake??""}"></label>
    </div>
    <div class="f" style="font-size:13px;font-weight:600;color:var(--muted)">Oder Defizit antippen, dann siehst du, wie viel du essen solltest</div>
    <div class="seg" role="group" aria-label="Defizit">
      ${[300,500,750,1000].map(d=>`<button type="button" data-def="${d}" aria-pressed="${settings.deficit===d && !settings.intake}">−${d}</button>`).join("")}
    </div>
    <div id="energyOut"></div>
  </div>`;
}
function bindEnergy(){
  const out = $("#energyOut");
  const calc = ()=>{
    const weight = num($("#e-w").value), age = num($("#e-age").value), steps = num($("#e-steps").value), intake = num($("#e-int").value);
    const en = energy({weight, heightCm: settings.heightCm, age, sex: settings.sex, steps});
    if (!en){
      const miss=[]; if(!weight) miss.push("Gewicht"); if(!age) miss.push("Alter"); if(!settings.heightCm) miss.push("Größe (oben in den Einstellungen)");
      out.innerHTML = `<div class="banner">Es fehlt noch: ${esc(miss.join(", "))}.</div>`; return; }
    const deficit = intake ? en.tdee - intake : settings.deficit;
    const eat = intake || (en.tdee - deficit);
    const perWeek = deficit*7/KCAL_PER_KG, perMonth = deficit*30.4/KCAL_PER_KG;
    let goal = "";
    if (settings.goalWeight && weight > settings.goalWeight && deficit > 0){
      const weeks = (weight - settings.goalWeight)/perWeek;
      const when = new Date(Date.now()+weeks*7*DAY);
      goal = `<div class="kv"><span>Zielgewicht ${fmt(settings.goalWeight)} kg</span><span>in ca. ${fmt(weeks,0)} Wochen<br><span class="sub">${esc(when.toLocaleDateString("de-DE",{month:"long",year:"numeric"}))}</span></span></div>`;
    }
    const warn = [];
    if (eat < en.bmr) warn.push("Du würdest weniger essen als dein Grundumsatz. Gerade mit appetithemmenden Wirkstoffen auf genug Eiweiß achten und das ärztlich begleiten lassen, sonst geht schnell Muskulatur verloren.");
    else if (deficit > 1000) warn.push("Ein Defizit über 1000 kcal ist sehr groß und erhöht das Risiko für Muskelverlust und Gallensteine.");
    const color = deficit>0 ? "var(--good)" : deficit<0 ? "var(--bad)" : "inherit";
    const vsBmr = eat - en.bmr;
    out.innerHTML = `<div class="stack" style="gap:10px">
      <div class="tile hero" style="gap:4px">
        <span class="k">${intake ? "Du isst pro Tag" : "So viel essen pro Tag"}</span>
        <span class="v" style="font-size:34px">${fmt(eat,0)} kcal</span>
        <span class="d">${intake ? `Tagesbedarf ${fmt(en.tdee,0)} − gegessen ${fmt(intake,0)} = ${deficit>0?"Defizit":"Überschuss"} ${fmt(Math.abs(deficit),0)} kcal` : `Tagesbedarf ${fmt(en.tdee,0)} − Defizit ${fmt(deficit,0)} kcal`}</span>
        <span class="d">${vsBmr<0 ? `${fmt(-vsBmr,0)} kcal unter deinem Grundumsatz (${fmt(en.bmr,0)})` : `${fmt(vsBmr,0)} kcal über deinem Grundumsatz (${fmt(en.bmr,0)})`}</span>
        <span style="margin-top:6px"><span class="pill">${deficit>0 ? `${sign(-perWeek,2)} kg pro Woche · ${sign(-perMonth,1)} kg pro Monat` : "kein Gewichtsverlust"}</span></span>
      </div>
      <div class="grid2">
        <div class="tile"><span class="k">Grundumsatz</span><span class="v">${fmt(en.bmr,0)}</span><span class="d">kcal in Ruhe</span></div>
        <div class="tile"><span class="k">Tagesbedarf</span><span class="v">${fmt(en.tdee,0)}</span><span class="d">kcal mit Schritten</span></div>
      </div>
      <div>
        <div class="kv"><span>Alltag (Grundumsatz × 1,2)</span><span>${fmt(en.base,0)} kcal</span></div>
        <div class="kv"><span>+ Schritte über 3.000</span><span>${fmt(en.stepKcal,0)} kcal</span></div>
        <div class="kv"><span>Essen pro Tag</span><span>${fmt(eat,0)} kcal</span></div>
        <div class="kv"><span>Defizit pro Tag</span><span style="color:${color}">${deficit>0?"−":"+"}${fmt(Math.abs(deficit),0)} kcal</span></div>
        <div class="kv"><span>Abnahme pro Woche</span><span style="color:${color}">${sign(-perWeek,2)} kg</span></div>
        <div class="kv"><span>Abnahme pro Monat</span><span style="color:${color}">${sign(-perMonth,1)} kg</span></div>
        ${goal}
      </div>
      ${deficit<=0?'<div class="banner">Kein Defizit: Mit dieser Menge hältst oder steigerst du dein Gewicht.</div>':""}
      ${warn.map(x=>`<div class="banner warn">${esc(x)}</div>`).join("")}
      <p class="sub" style="margin:0">Schätzung: 1 kg Fett ≈ 7.700 kcal. Anfangs sinkt das Gewicht durch Wasser schneller, später langsamer, weil der Bedarf mit dem Gewicht sinkt. Rechne neu, wenn du leichter bist.</p>
    </div>`;
  };
  const persist = ()=>{ settings.calcWeight=num($("#e-w").value); settings.calcWeightAt=new Date().toISOString(); settings.age=num($("#e-age").value); settings.steps=num($("#e-steps").value); settings.intake=num($("#e-int").value); saveSettings(); };
  ["e-w","e-age","e-steps","e-int"].forEach(id=>{ $("#"+id).oninput=()=>{ calc(); if(id==="e-int") $$def(); }; $("#"+id).onchange=persist; });
  const $$def = ()=>document.querySelectorAll("[data-def]").forEach(b=>b.setAttribute("aria-pressed", String(!num($("#e-int").value) && settings.deficit===+b.dataset.def)));
  document.querySelectorAll("[data-sex]").forEach(b=>b.onclick=()=>{ settings.sex=b.dataset.sex; document.querySelectorAll("[data-sex]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.sex===settings.sex))); saveSettings(); calc(); });
  document.querySelectorAll("[data-def]").forEach(b=>b.onclick=()=>{ settings.deficit=+b.dataset.def; $("#e-int").value=""; settings.intake=null; saveSettings(); $$def(); calc(); });
  calc();
}

  });

- Dosierungen und Titrationsschemata aus Studien darfst du als Studienfakt beschreiben. Gib aber keine persönliche Dosisempfehlung und keinen Rat zum Steigern, sondern verweise dafür auf ärztliche Begleitung.
- Bei Produkten außerhalb zugelassener Quellen erklärst du sachlich die belegten Risiken (Reinheit, Fehldosierung, Sterilität, fehlende Kontrolle), ohne zu moralisieren. Nenne nie Bezugsquellen.
- Nenne Warnzeichen, die sofort ärztlich abgeklärt gehören, wenn sie zum Thema passen: starke anhaltende Bauchschmerzen (Pankreatitis), Schmerzen im rechten Oberbauch (Gallenblase), anhaltendes Erbrechen oder Austrocknung, Herzrasen, Unterzuckerungszeichen bei Diabetesmedikation.
- Wenn dir das Werkzeug pubmed_suche zur Verfügung steht: Suche bei jeder Sachfrage ZUERST in PubMed, bevor du antwortest (englische Suchbegriffe, höchstens fünf, z. B. "retatrutide phase 3" oder "BPC-157 human"). Bei Bedarf eine zweite, gezieltere Suche. Bevorzuge randomisierte Studien, Meta-Analysen und Reviews; prüfe Jahr und Studientyp. Kennzeichne Aussagen aus den Treffern mit "Laut PubMed" und setze bei jeder zitierten Arbeit den DOI als Link, Format [Autor Jahr](https://doi.org/DOI). Findest du nichts Passendes, sag das ehrlich. Ende mit einer kurzen Liste "Quellen (PubMed)".
- Wenn Tracker-Daten mitgeschickt werden, kannst du sie mit Studienverläufen vergleichen, ohne daraus eine Diagnose oder Dosisempfehlung abzuleiten.

${KNOWLEDGE}`;

function trackerContext(){
  const s = stats();
  const lines = [];
  lines.push("TRACKER-DATEN DES NUTZERS (Stand "+fmtDate(new Date())+"):");
  if (s.first) lines.push(`Startgewicht ${fmt(s.first.weight)} kg am ${fmtDate(s.first.date)}, aktuell ${fmt(s.last.weight)} kg am ${fmtDate(s.last.date)} (${sign(s.change)} kg, ${sign(s.changePct)} %).`);
  if (s.waistLast!=null) lines.push(`Taille aktuell ${fmt(s.waistLast)} cm${s.waistChange!=null?` (${sign(s.waistChange)} cm)`:""}.`);
  lines.push(`${s.injCount} Injektionen, Rhythmus alle ${settings.intervalDays} Tage.`);
  if (s.last){ const en = energy({weight:s.last.weight, heightCm:settings.heightCm, age:settings.age, sex:settings.sex, steps:settings.steps}); if(en) lines.push(`Alter ${settings.age}, ${settings.sex==="w"?"weiblich":"männlich"}, Größe ${settings.heightCm} cm, ca. ${settings.steps||0} Schritte/Tag. Geschätzter Grundumsatz ${Math.round(en.bmr)} kcal, Tagesbedarf ${Math.round(en.tdee)} kcal${settings.intake?`, isst ca. ${settings.intake} kcal`:""}.`); }
  const recent = sorted().slice(-20).map(e=>{
    const p=[fmtDate(e.date)];
    if(e.type==="injection") p.push(`${e.peptide||"?"} ${fmt(e.doseMg,2)} mg`);
    if(e.weight!=null) p.push(`${fmt(e.weight)} kg`);
    if(e.waistCircumference!=null) p.push(`Taille ${fmt(e.waistCircumference)} cm`);
    for (const [k,l] of [["hunger","Hunger"],["satiety","Sättigung"],["nausea","Übelkeit"],["energyLevel","Energie"]]) if(e[k]!=null) p.push(`${l} ${e[k]}/10`);
    if(e.sideEffects.length) p.push("NW: "+e.sideEffects.join(", "));
    if(e.notes && !e.auto) p.push("Notiz: "+e.notes.slice(0,140));
    return "- "+p.join(", ");
  });
  return lines.concat(["Letzte Einträge:"], recent).join("\n");
}

function md(text){
  const lines = esc(text).split("\n");
  let out="", inList=false, para=[];
  const inline = t => t.replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,(m,l,u)=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`).replace(/(^|[\s(])(https:\/\/doi\.org\/[^\s)<]+)/g,(m,pre,u)=>`${pre}<a href="${u}" target="_blank" rel="noopener">${u.replace("https://","")}</a>`).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,"$1<i>$2</i>");
  const flushP = ()=>{ if(para.length){ out+="<p>"+inline(para.join("<br>"))+"</p>"; para=[]; } };
  const closeL = ()=>{ if(inList){ out+="</ul>"; inList=false; } };
  for (const raw of lines){
    const l = raw.trim();
    if (!l){ flushP(); closeL(); continue; }
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)$/))){ flushP(); closeL(); out+="<h4>"+inline(m[1])+"</h4>"; continue; }
    if ((m = l.match(/^(?:[-•*]|\d+[.)])\s+(.*)$/))){ flushP(); if(!inList){ out+="<ul>"; inList=true; } out+="<li>"+inline(m[1])+"</li>"; continue; }
    if (/^\|/.test(l)){ flushP(); closeL(); if(/^\|[\s:|-]+\|$/.test(l)) continue; out+="<p>"+inline(l.replace(/^\||\|$/g,"").split("|").map(x=>x.trim()).join(" · "))+"</p>"; continue; }
    closeL(); para.push(l);
  }
  flushP(); closeL();
  return out;
}

function pubmedTool(onStatus){
  return {
    name: "pubmed_suche",
    description: "Durchsucht PubMed (NIH-Datenbank für medizinische Fachliteratur) und liefert bis zu 8 Treffer mit PMID, Titel, Zeitschrift, Jahr, Studientyp, DOI und gekürztem Abstract. Für jede Sachfrage zu Studien benutzen.",
    inputSchema: {type:"object", properties:{
      query:{type:"string", description:"PubMed-Suchbegriffe auf Englisch, höchstens fünf, kein ganzer Satz. Feldtags erlaubt, z. B. retatrutide AND Randomized Controlled Trial[Publication Type]"},
      neueste_zuerst:{type:"boolean", description:"true = nach Datum sortieren statt nach Relevanz"},
      ab_jahr:{type:"string", description:"optional, z. B. 2023"}
    }, required:["query"]},
    async execute(input, ctx){
      const q = String(input.query||"").replace(/\*/g,"").slice(0,200).trim();
      if (!q) throw new Error("Leere Suchanfrage");
      onStatus(`Suche in PubMed: „${q}“ …`);
      const args = {query:q, max_results: sparmodus ? 5 : 8, sort: input.neueste_zuerst ? "pub_date" : "relevance"};
      if (input.ab_jahr && /^\d{4}$/.test(String(input.ab_jahr))) args.date_from = String(input.ab_jahr);
      let res;
      try { res = await mcp.callTool("PubMed","search_articles",args,{signal:ctx.signal, cache:{staleTime:6*3600e3, gcTime:24*3600e3}}); }
      catch(e){ throw new Error(mcpMsg(e)); }
      const ids = (res.payload && res.payload.pmids) || [];
      if (!ids.length) return {treffer:0, gesamt: res.payload?.total_count||0, hinweis:"Keine Treffer. Andere oder weniger Suchbegriffe probieren."};
      onStatus(`Lese ${ids.length} Studien aus PubMed …`);
      let meta;
      try { meta = await mcp.callTool("PubMed","get_article_metadata",{pmids:ids},{signal:ctx.signal, cache:{staleTime:7*24*3600e3, gcTime:7*24*3600e3}}); }
      catch(e){ throw new Error(mcpMsg(e)); }
      const arts = (meta.payload && meta.payload.articles) || [];
      return {
        gesamt_treffer: res.payload.total_count,
        hinweis: "Quelle PubMed. Zitiere mit 'Laut PubMed' und DOI-Link.",
        artikel: arts.map(a=>({
          pmid: a.identifiers?.pmid, doi: a.identifiers?.doi || a.doi || null,
          titel: a.title, zeitschrift: a.journal?.iso_abbreviation || a.journal?.title,
          jahr: a.publication_date?.year, typ: (a.article_types||[]).join(", "),
          erstautor: a.authors && a.authors[0] ? a.authors[0].last_name : null,
          abstract: String(a.abstract||"").slice(0, sparmodus ? 700 : 1400)
        }))
      };
    }
  };
}
function mcpMsg(e){
  const c = e && e.code;
  if (c==="server_not_connected") return "PubMed ist nicht verbunden (claude.ai > Einstellungen > Konnektoren).";
  if (c==="needs_reauth") return "PubMed muss neu verbunden werden.";
  if (c==="not_in_manifest" || c==="approval_required") return "PubMed-Nutzung wurde für diese App nicht erlaubt.";
  if (c==="server_unavailable") return "PubMed antwortet gerade nicht.";
  return "PubMed-Fehler: " + ((e && e.message) || c || "unbekannt");
}

}
async function pmSearch(q){
  q = String(q||"").replace(/\*/g,"").trim().slice(0,200);
  if (!q) return;
  pmState.q = q; pmState.err=""; pmState.busy=true; renderPm();
  if (!mcp){ pmState.busy=false; pmState.err="PubMed ist in dieser Ansicht nicht erreichbar. Öffne den Link in der Claude-App oder auf claude.ai."; renderPm(); return; }
  const cache = {staleTime:6*3600e3, gcTime:24*3600e3};
  try {
    const res = await mcp.callTool("PubMed","search_articles",{query: q + FILTERS[pmState.filter], max_results:10, sort:pmState.sort},{cache});
    const ids = res.payload?.pmids || [];
    pmState.total = res.payload?.total_count || 0;
    pmState.results = [];
    if (ids.length){
      const meta = await mcp.callTool("PubMed","get_article_metadata",{pmids:ids},{cache:{staleTime:7*24*3600e3, gcTime:7*24*3600e3}});
      const byId = new Map((meta.payload?.articles||[]).map(a=>[a.identifiers?.pmid, a]));
      pmState.results = ids.map(id=>byId.get(id)).filter(Boolean);
    }
  } catch(e){ pmState.err = mcpMsg(e); }
  pmState.busy=false; renderPm();
  if (autoTr && pmState.results.length) translateTitles();
}

/* ---------- Übersetzung: zuerst kostenlos im Gerät (falls der Browser es kann), sonst kleines KI-Modell ---------- */
let devTranslator = null, devTrChecked = false;
async function getDeviceTranslator(){
  if (devTrChecked) return devTranslator;
  devTrChecked = true;
  try {
    if ("Translator" in self){
      const av = await Translator.availability({sourceLanguage:"en", targetLanguage:"de"});
      if (av && av!=="unavailable") devTranslator = await Translator.create({sourceLanguage:"en", targetLanguage:"de"});
    }
  } catch(_){ devTranslator = null; }
  return devTranslator;
}
function trInfo(){
  const el = $("#trInfo"); if(!el) return;
  if (!autoTr){ el.textContent = "Aus: Titel und Abstracts bleiben auf Englisch."; return; }
  getDeviceTranslator().then(t=>{ el.textContent = t ? "Übersetzt kostenlos direkt im Browser." : sample ? "Übersetzt mit dem kleinsten KI-Modell: Titel gesammelt in einer Anfrage, Abstracts erst beim Aufklappen. Sehr wenig Guthaben, 24 h zwischengespeichert." : "Automatische Übersetzung braucht Chrome am Computer. Tipp: Lange auf den Text drücken → Übersetzen (iPhone)."; });
}
async function translateTitles(){
  const list = pmState.results.filter(a=>!a.titleDe && a.title);
  if (!list.length) return;
  const q = pmState.q;
  const dev = await getDeviceTranslator();
  try {
    if (dev){
      for (const a of list){ a.titleDe = await dev.translate(a.title); }
    } else if (sample){
      const arr = await sample.json(
        "Übersetze diese medizinischen Studientitel ins Deutsche. Fachbegriffe und Wirkstoffnamen korrekt, nichts hinzufügen. Antworte nur mit einem JSON-Array von Strings in derselben Reihenfolge.\n\n" + JSON.stringify(list.map(a=>a.title)),
        {modelTier:"quick", cache:{gcTime:24*3600e3}});
      if (Array.isArray(arr)) list.forEach((a,i)=>{ if(typeof arr[i]==="string" && arr[i].trim()) a.titleDe = arr[i].trim(); });
    } else return;
  } catch(e){ if (e && (e.code==="not_granted"||e.code==="sampling_disabled")){ const el=$("#trInfo"); if(el) el.textContent="KI-Nutzung nicht erlaubt, darum keine Übersetzung."; } }
  if (pmState.q===q) renderPm();
}
async function translateAbstract(i){
  const a = pmState.results[i]; if (!a || a.abstractDe || a._tr) return;
  const p = $("#abs-"+i); a._tr = true;
  if (p) p.textContent = "Übersetze …";
  const dev = await getDeviceTranslator();
  try {
    if (dev){ a.abstractDe = await dev.translate(a.abstract); }
    else if (sample){
      const {text} = await sample("Übersetze diesen Abstract einer medizinischen Studie vollständig und genau ins Deutsche. Zahlen, Einheiten und Wirkstoffnamen unverändert. Behalte Abschnittsüberschriften (z. B. HINTERGRUND, METHODEN, ERGEBNISSE, SCHLUSSFOLGERUNG). Gib nur die Übersetzung aus.\n\n" + String(a.abstract).slice(0,6000), {modelTier:"quick", cache:{gcTime:24*3600e3}});
      a.abstractDe = text.trim();
    }
  } catch(_){}
  a._tr = false;
  if (!a.abstractDe && p) p.textContent = a.abstract;
  else renderPm();
}

async function summarize(i, btn){
  const a = pmState.results[i]; const box = $("#sum-"+i);
  if (!a || !box || !sample) return;
  btn.disabled = true; box.hidden=false; box.classList.add("thinking"); box.textContent="Übersetze …";
  const doi = a.identifiers?.doi || a.doi;
  const prompt = `Fasse diese Studie aus PubMed auf Deutsch in höchstens 5 kurzen Stichpunkten zusammen: Studientyp und Teilnehmer, was untersucht wurde, Hauptergebnis mit Zahlen, Nebenwirkungen falls genannt, Aussagekraft (z. B. klein, Tierstudie, nur Pressemitteilung). Keine Dosisempfehlung. Ende mit "Quelle: PubMed${doi?`, https://doi.org/${doi}`:""}".\n\nTitel: ${a.title}\nJahr: ${a.publication_date?.year||"?"}\nTyp: ${(a.article_types||[]).join(", ")}\nAbstract: ${String(a.abstract).slice(0,3000)}`;
  try {
    const {text} = await sample(prompt, {modelTier:"quick", cache:{gcTime:24*3600e3}, onText:({text})=>{ box.classList.remove("thinking"); box.innerHTML = md(text); }});
    box.classList.remove("thinking"); box.innerHTML = md(text);
  } catch(e){
    box.classList.remove("thinking");
    box.textContent = e && e.code==="not_granted" ? "KI-Nutzung nicht erlaubt." : e && e.code==="rate_limited" ? "Gerade zu viele Anfragen, später nochmal." : "Zusammenfassung fehlgeschlagen.";
    btn.disabled=false;
  }
}

function renderMsgs(streamText){
  const box = $("#msgs"); if(!box) return;
  const q = $("#quick");
  if (q){ q.innerHTML = chat.length ? "" : QUICK.map(x=>`<button type="button">${esc(x)}</button>`).join(""); q.querySelectorAll("button").forEach(b=>b.onclick=()=>sendChat(b.textContent)); }
  let html = chat.map(t=> t.role==="user" ? `<div class="msg u">${esc(t.content)}</div>` : `<div class="msg a">${md(t.content)}</div>`).join("");
  if (chatBusy) html += streamText ? `<div class="msg a" id="live">${md(streamText)}</div>` : `<div class="msg a thinking" id="live">Denkt nach …</div>`;
  if (!chat.length && !chatBusy) html = `<div class="sub" style="text-align:center;padding:8px 0">Tippe eine Beispielfrage an oder schreib deine eigene.</div>`;
  box.innerHTML = html;
  const sb=$("#sendBtn"), st=$("#stopBtn");
  if (sb){ sb.hidden = chatBusy; st.hidden = !chatBusy; }
  const off=$("#aiOff"); if(off) off.hidden = !!sample || mode==="connecting";
}

async function sendChat(text){
  text = (text||"").trim();
  if (!text || chatBusy) return;
  if (!sample){ const off=$("#aiOff"); if(off) off.hidden=false; return; }
  const inp=$("#chatIn"); if(inp) inp.value="";
  chat.push({role:"user", content:text});
  chatBusy = true; renderMsgs();
  window.scrollTo(0, document.body.scrollHeight);
  const ctx = RULES + (withData && entries.length ? "\n\n"+trackerContext() : "");
  const history = chat.slice(sparmodus ? -6 : -16);
  while (history.length && history[0].role!=="user") history.shift();
  const input = [{role:"user", content:ctx}, ...history];
  chatCtl = new AbortController();
  let shown = "";
  const setStatus = t => { const live=$("#live"); if(live && !shown){ live.textContent = t; } };
  const opts = { cache:false, signal:chatCtl.signal, onText:({text})=>{ shown=text; const live=$("#live"); if(live){ live.classList.remove("thinking"); live.innerHTML=md(text); } } };
  let usePub = false;
  if (mcp){ try { const lim = await sample.limits(); usePub = !!(lim && lim.tools); } catch(_){} }
  if (sparmodus){ opts.modelTier = "quick"; input[0] = {role:"user", content: input[0].content + "\n\nSPARMODUS: Höchstens eine PubMed-Suche. Antworte knapp, höchstens etwa 200 Wörter plus Quellen."}; }
  if (usePub){ opts.tools = [pubmedTool(setStatus)]; }
  else input[0] = {role:"user", content: input[0].content + "\n\n(Hinweis: PubMed-Suche ist in dieser Ansicht nicht verfügbar. Antworte aus deinem Wissen und dem WISSENSSTAND und sag dazu, dass du nicht live gesucht hast.)"};
  try {
    const res = await sample(input, opts);
    chat.push({role:"assistant", content: res.text + (res.truncated ? "\n\n*(Antwort gekürzt – frag gezielter nach.)*" : "")});
  } catch(e){
    const code = e && e.code;
    const keep = (e && e.text) || "";
    let note = "";
    if (code==="cancelled") note = "*(gestoppt)*";
    else if (code==="not_granted" || code==="sampling_disabled" || code==="not_declared" || code==="capability_disabled" || code==="capability_removed"){ note = "*KI-Nutzung wurde nicht erlaubt oder ist hier nicht verfügbar.*"; sample = null; }
    else if (code==="rate_limited") note = "*Gerade zu viele Anfragen oder Nutzungslimit erreicht. Versuch es später nochmal.*";
    else if (code==="refused") note = "*Dazu kann ich so nicht antworten. Formuliere die Frage anders.*";
    else if (code==="session_expired") note = "*Bitte neu bei Claude anmelden.*";
    else if (code==="tools_unavailable") note = "*PubMed-Suche ist in dieser Ansicht nicht verfügbar. Frag nochmal, dann antworte ich ohne Live-Suche.*";
    else if (code==="prompt_too_large"){ note = "*Der Verlauf ist zu lang. Leere den Chat und frag erneut.*"; }
    else note = "*Verbindung unterbrochen. Tippe nochmal auf Senden.*";
    chat.push({role:"assistant", content: (code==="refused"?"":keep) ? keep+"\n\n"+note : note});
  } finally {
    chatBusy = false; chatCtl = null;
    saveChat(); renderMsgs();
  }
}

function toCsv(){
  const cols=["date","type","peptide","dosage","doseMg","manufacturer","vial","site","weight","waistCircumference","hunger","satiety","nausea","energyLevel","doseChange","sideEffects","notes","id"];
  const q = x => { const s = x==null?"":Array.isArray(x)?x.join("; "):String(x); return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  return "﻿"+cols.join(";")+"\n"+sorted().map(e=>cols.map(c=>c==="doseMg"||c==="weight"||c==="waistCircumference" ? (e[c]==null?"":String(e[c]).replace(".",",")) : q(e[c])).join(";")).join("\n");
}
async function doDownload(name, data){
  if (!downloads){ toast("Download hier nicht verfügbar – nutze 'JSON kopieren'"); return; }
  try { await downloads.save({filename:name, data}); toast("Datei gespeichert"); }
  catch(err){ if(err && err.code==="declined") return; toast("Download nicht möglich – nutze 'JSON kopieren'"); }
}

/* ---------- dialogs ---------- */
function openDlg(title, bodyHtml, buttons){
  $("#dlgTitle").textContent=title; $("#dlgBody").innerHTML=bodyHtml;
  const bb=$("#dlgBtns"); bb.innerHTML="";
  for (const b of buttons){ const el=document.createElement("button"); el.type="button"; el.className="btn grow "+(b.cls||""); el.textContent=b.label; el.onclick=b.onclick; bb.appendChild(el); }
  $("#dialog").classList.add("open");
}
function closeDlg(){ $("#dialog").classList.remove("open"); }
$("#dialog").addEventListener("click", e=>{ if(e.target.id==="dialog") closeDlg(); });
function confirmDlg(title, text, okLabel, onOk){
  openDlg(title, `<p style="margin:0">${esc(text)}</p>`, [{label:"Abbrechen", onclick:closeDlg},{label:okLabel, cls:"danger", onclick:async()=>{ closeDlg(); await onOk(); }}]);
}
function openImport(){
  openDlg("JSON importieren", `<div class="stack">
    <p class="sub" style="margin:0">Wähle die Export-Datei der alten App (retatracker-export-….json) oder füge den Inhalt ein. Doppelte Einträge (gleiche ID) werden übersprungen.</p>
    <label class="btn" for="impFile" style="text-align:center">Datei auswählen</label>
    <input type="file" id="impFile" accept=".json,application/json,text/plain" hidden>
    <label class="f" for="impText">… oder Text einfügen<textarea id="impText" placeholder='[{"peptide": "RT", ...}]'></textarea></label>
    <div id="impMsg" class="sub"></div>
  </div>`, [{label:"Abbrechen", onclick:closeDlg},{label:"Importieren", cls:"primary", onclick:()=>runImport($("#impText").value)}]);
  $("#impFile").onchange = async ev => { const f=ev.target.files[0]; if(!f) return; const txt=await f.text(); $("#impText").value=txt; $("#impMsg").textContent=`${f.name} geladen. Tippe auf Importieren.`; };
}
async function runImport(txt){
  let arr;
  try { arr = JSON.parse(txt); } catch(_){ $("#impMsg").textContent="Das ist kein gültiges JSON. Prüfe, ob der komplette Inhalt eingefügt ist."; return; }
  if (!Array.isArray(arr)) arr = Array.isArray(arr?.entries) ? arr.entries : null;
  if (!arr){ $("#impMsg").textContent="Erwartet wird eine Liste von Einträgen."; return; }
  const have = new Set(entries.map(e=>e.id));
  const fresh = arr.filter(x=>x && typeof x==="object").map(normalize).filter(e=>!have.has(e.id));
  $("#impMsg").textContent = `Importiere ${fresh.length} …`;
  let ok=0;
  for (const e of fresh){
    entries.push(e);
    if (mode==="db"){ try{ await putRemote(e); ok++; }catch(err){ handleWriteError(err); break; } }
    else ok++;
  }
  if (mode!=="db") lsSave();
  closeDlg(); render();
  toast(`${ok} Einträge importiert${arr.length-fresh.length?`, ${arr.length-fresh.length} übersprungen`:""}`);
}

/* ---------- theme ---------- */
$("#themeBtn").onclick=()=>{
  const r=document.documentElement;
  const light = r.dataset.theme==="light";
  if (light) delete r.dataset.theme; else r.dataset.theme="light";
  try{ localStorage.setItem("retatracker.theme", light?"dark":"light"); }catch(_){}
};
try{ const t=localStorage.getItem("retatracker.theme"); if(t==="light") document.documentElement.dataset.theme="light"; }catch(_){}

window.addEventListener("hashchange", ()=>{ if(location.hash!=="#log") editing=null; $("#view").dataset.view=""; render(); window.scrollTo(0,0); });
connect();
})();
